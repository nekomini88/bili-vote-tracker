<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bili Vote Tracker</title>
<script src="/assets/vendor/tailwind.min.js"></script>
<script>
tailwind.config = {
  corePlugins: { preflight: false },   // 禁用 reset，避免破坏现有元素
  theme: {
    extend: {
      colors: {
        bg:    'var(--bg)',
        card:  'var(--card)',
        line:  'var(--line)',
        ink:   'var(--ink)',
        muted: 'var(--muted)',
        accent:'var(--accent)',
        ok:    'var(--ok)',
        warn:  'var(--warn)',
        danger:'var(--danger)',
      },
      fontFamily: {
        sans: ['-apple-system','BlinkMacSystemFont','"Segoe UI"','"PingFang SC"','"Microsoft YaHei"','sans-serif'],
      },
      boxShadow: {
        card: '0 2px 12px rgba(0,0,0,.06)',
        lift: '0 10px 30px rgba(0,0,0,.12)',
      },
      borderRadius: {
        xl2: '16px',
        xl3: '20px',
      },
    }
  }
}
</script>
<style>
:root{color-scheme:light;--bg:#f7f8fa;--card:#fff;--line:#e5e7eb;--ink:#303133;--muted:#606266;--accent:#409eff;--ok:#67c23a;--warn:#e6a23c;--danger:#f56c6c;--shadow:0 2px 12px rgba(0,0,0,.06);--r:10px;--theme-name:emerald;--banner-from:#f3fbf6;--banner-to:#eef7f1;--banner-line:#cde6d0}
[data-theme="midnight"]{--bg:#f4f6f9;--card:#ffffff;--line:#e5e7eb;--ink:#0f172a;--muted:#475569;--accent:#3b82f6;--ok:#10b981;--warn:#f59e0b;--danger:#ef4444;--banner-from:#eef2ff;--banner-to:#e0e7ff;--banner-line:#c7d2fe}
[data-theme="ruby"]{--bg:#fff5f6;--card:#ffffff;--line:#fbd0d6;--ink:#2b1018;--muted:#6f3a4a;--accent:#e11d48;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--banner-from:#fff1f4;--banner-to:#ffe4e6;--banner-line:#fecdd3}
[data-theme="gold"]{--bg:#fffbf5;--card:#ffffff;--line:#f0d898;--ink:#3b2a10;--muted:#7c5a20;--accent:#d97706;--ok:#15803d;--warn:#b45309;--danger:#b91c1c;--banner-from:#fffbeb;--banner-to:#fef3c7;--banner-line:#fde68a}
[data-theme="ocean"]{--bg:#f0f9ff;--card:#ffffff;--line:#cfe5f7;--ink:#052038;--muted:#3b6d88;--accent:#0284c7;--ok:#059669;--warn:#d97706;--danger:#dc2626;--banner-from:#e0f2fe;--banner-to:#cffafe;--banner-line:#a5f3fc}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
.glass-orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.glass-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;animation:orb-float 18s ease-in-out infinite alternate}
.glass-orb-1{width:50vw;height:50vh;top:-10%;left:-5%;background:#0089c966}
.glass-orb-2{width:40vw;height:45vh;bottom:-5%;right:-5%;background:#00a88359}
.glass-orb-3{width:35vw;height:35vh;top:30%;left:40%;background:#b37ed84d}
@keyframes orb-float{0%{transform:translate(0) scale(1)}50%{transform:translate(8%,12%) scale(1.1)}to{transform:translate(-5%,8%) scale(.95)}}
.app{max-width:1280px;margin:0 auto;padding:24px 14px 64px}
header{display:flex;align-items:center;justify-content:space-between;margin:16px 0 18px;flex-wrap:wrap;gap:10px}
header h1{font-size:22px;font-weight:700;margin:0;letter-spacing:.2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 10px;border:none;border-radius:8px;color:var(--muted);background:transparent;cursor:pointer;font-size:16px;transition:color .15s,background .15s}
.btn:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.btn-tr{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted);cursor:pointer;font-size:14px;font-weight:500;box-shadow:var(--shadow);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.btn-tr:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12);color:var(--ink)}
.btn-tr:active{transform:translateY(0) scale(.96)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.stat{transition:transform .2s ease,box-shadow .2s ease}
.stat:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.10)}
.stat .label{font-size:12px;color:var(--muted);letter-spacing:.3px}
.stat .value{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi-green{color:var(--ok)}.kpi-blue{color:var(--accent)}.kpi-orange{color:var(--warn)}.kpi-red{color:var(--danger)}
.table-wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:18px}
table{width:100%;border-collapse:collapse;min-width:1100px}
th,td{text-align:left;padding:12px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px;vertical-align:middle;white-space:nowrap}
th{color:var(--ink);font-weight:600;position:sticky;top:0;z-index:1}
tbody tr{transition:background .12s ease}
tbody tr:hover{background:rgba(0,0,0,.03)}
.cand-name{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.cand-rank{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:7px;background:color-mix(in oklch,var(--accent) 14%,transparent);color:var(--accent);font-size:12px;font-weight:700}
.vote-val{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:18px}
.chart-header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.empty{text-align:center;padding:24px;color:var(--muted)}
.muted{color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:8px 14px;border:1px solid var(--line);background:var(--card);border-radius:999px;cursor:pointer;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;transition:all .18s }
.tab:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent));color:#fff;border-color:var(--accent);box-shadow:0 4px 14px rgba(64,158,255,.3)}
.tab-desc{font-size:11px;opacity:.85}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px 0 8px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:18px;width:min(420px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.15)}
.modal h3{margin:0 0 12px}
.modal .field{margin-bottom:10px}
.delta-up{color:var(--danger)}.delta-down{color:var(--ok)}.delta-flat{color:var(--muted)}
.hidden{display:none !important}

.candidate-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.candidate-wrap label{font-size:13px;color:var(--muted)}
.candidate-wrap select{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink);font-size:14px;min-width:180px;cursor:pointer}
.chart-hint{font-size:12px;color:var(--muted)}
.placeholder{opacity:.25}
</style>
</head>
<body>
<div class="glass-orbs" aria-hidden="true">
  <div class="glass-orb glass-orb-1"></div>
  <div class="glass-orb glass-orb-2"></div>
  <div class="glass-orb glass-orb-3"></div>
</div>
<div class="app">
  <header>
    <h1 class="flex items-center gap-2! text-2xl! font-bold! bg-gradient-to-r from-accent to-accent/70 bg-clip-text text-transparent">📊 <span>Bili Vote Tracker</span></h1>
    <div style="display:flex;align-items:center;gap:6px">
      <select id="themeSelect" onchange="setTheme(this.value)" title="主题" class="border! border-line! bg-card! text-ink! rounded-xl2! px-3! py-2! text-sm! cursor-pointer! shadow-card!">
        <option value="emerald">Emerald</option>
        <option value="midnight">Midnight</option>
        <option value="ruby">Ruby</option>
        <option value="gold">Gold</option>
        <option value="ocean">Ocean</option>
      </select>
      <button class="btn btn-tr" id="btnTrigger" onclick="openAdmin()" title="管理后台"><span>🔐</span> 管理</button>
    </div>
  </header>

  <div class="stats">
    <div class="card stat" style="border-left:3px solid var(--ink)"><div class="label">候选人</div><div class="value" id="s_candidates"><span class="skeleton">加载中</span></div></div>
    <div class="card stat" style="border-left:3px solid var(--accent)"><div class="label">总采集数</div><div class="value kpi-blue" id="s_count"><span class="skeleton">--</span></div></div>
    <div class="card stat" style="border-left:3px solid var(--warn)"><div class="label">最高票数</div><div class="value kpi-orange" id="s_max"><span class="skeleton">--</span></div></div>
    <div class="card stat" style="border-left:3px solid var(--ok)"><div class="label">最近采集</div><div class="value kpi-green" id="s_latest"><span class="skeleton">--</span></div></div>
  </div>

  <div class="table-wrap hover:shadow-lift! transition-shadow! duration-300!">
    <table>
      <thead>
        <tr style="background:linear-gradient(180deg,var(--banner-from),var(--banner-to))">
          <th>#</th>
          <th>候选人</th>
          <th>当前票数</th>
          <th title="与1分钟前相比">1分钟差</th>
          <th title="与5分钟前相比">5分钟差</th>
          <th title="与30分钟前相比">30分钟差</th>
          <th title="与6小时前相比">6小时差</th>
          <th title="与24小时前相比">24小时差</th>
          <th>最近采集时间 (UTC+8)</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div id="chartArea">
    <div class="chart hover:shadow-lift! transition-shadow! duration-300!">
    <div class="chart-header">
      <h3 style="margin:0" class="flex items-center gap-2! text-lg! font-bold!">📈 统计图表</h3>
      <div class="candidate-wrap">
        <label for="chartCandidate">候选人：</label>
        <select id="chartCandidate" onchange="onCandChange()" class="border! border-line! bg-card! text-ink! rounded-xl2! px-3! py-2! text-sm! cursor-pointer! shadow-card!">
          <option value="">- 加载中 -</option>
        </select>
      </div>
      <span class="muted chart-hint" id="chartHint">请选择候选人</span>
      <label style="font-size:13px;color:var(--muted);margin-left:8px;display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="rangeMode" onchange="drawChart()"> 按时间段查询
      </label>
      <input type="datetime-local" id="rangeStart" onchange="onRangeChange()" class="border! border-line! bg-card! text-ink! rounded-lg! px-2! py-1.5! text-sm!">
      <input type="datetime-local" id="rangeEnd" onchange="onRangeChange()" class="border! border-line! bg-card! text-ink! rounded-lg! px-2! py-1.5! text-sm!">
    </div>
    <div class="tabs">
      <button class="tab active" onclick="setChartMode('trend', this)">📈 趋势线<span class="tab-desc">随时间的票数走势</span></button>
      <button class="tab" onclick="setChartMode('bar', this)">📊 票数对比<span class="tab-desc">当前各候选人票数对比</span></button>
      <button class="tab" onclick="setChartMode('delta', this)">📉 增量柱状<span class="tab-desc">每轮采集的票数增量</span></button>
    </div>
    <canvas id="chartCanvas" height="260" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;display:none"></canvas>
    <div style="margin-top:8px;display:none" id="chartTableWrap">
      <table>
        <thead>
          <tr style="background:linear-gradient(180deg,var(--banner-from),var(--banner-to))"><th>#</th><th>采集时间</th><th>票数</th><th>环比增量</th></tr>
        </thead>
        <tbody id="chartRows"></tbody>
      </table>
    </div>
  </div>
</div>

  <footer style="width:100%;display:flex;justify-content:space-between;align-items:center;max-width:1600px;margin:0 auto;padding:16px;font-size:12px;color:#606266">
    <span>Powered By <a href="#" style="color:#606266;text-decoration:none;font-weight:500">Nekomini</a></span>
    <span id="footerGeo" style="display:inline-flex;align-items:center;gap:8px;background:#ffffff;border:1px solid rgba(0,0,0,0.06);border-radius:999px;padding:6px 14px;box-shadow:0 1px 4px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.9);transition:all 250ms ease;cursor:pointer;color:#606266;font-size:12px;font-weight:500" onclick="toggleFooterPill(this)">
      <span id="footerFlag" style="font-size:14px;line-height:1">-</span>
      <span id="footerLocation" style="color:#606266;font-weight:500">-</span>
      <span style="width:1px;height:14px;background:rgba(0,0,0,0.08);margin:0 4px"></span>
      <span id="footerIp" style="color:#606266;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#e8f5e9;display:inline-flex;align-items:center;justify-content:center"><span style="width:5px;height:5px;border-radius:50%;background:#4caf50"></span></span><span id="footerIpText">-</span></span>
      <span style="width:1px;height:14px;background:rgba(0,0,0,0.08);margin:0 4px"></span>
      <span id="footerBrowser" style="color:#606266;display:inline-flex;align-items:center;gap:4px;font-weight:500"><span style="width:12px;height:12px;border-radius:3px;border:1.5px solid #81c784;display:inline-flex;align-items:center;justify-content:center"><span style="width:4px;height:4px;border-radius:50%;background:#66bb6a"></span></span><span id="footerBrowserText">-</span></span>
    </span>
    <span>Theme by <a href="#" style="color:#606266;text-decoration:none;font-weight:500">Nekomini</a></span>
  </footer>
<div class="modal-backdrop" id="adminModal">
  <div class="modal" style="background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <h3 style="margin:0 0 12px;font-size:18px">🔐 管理员后台</h3>
    <div class="field">
      <label>账号</label>
      <input id="adUser" type="text" class="w-full! border! border-line! bg-bg! text-ink! rounded-xl2! px-3! py-2! text-sm! outline-none! focus:ring-2! focus:ring-accent! transition! mt-1!" />
    </div>
    <div class="field">
      <label>密码</label>
      <input id="adPass" type="password" class="w-full! border! border-line! bg-bg! text-ink! rounded-xl2! px-3! py-2! text-sm! outline-none! focus:ring-2! focus:ring-accent! transition! mt-1!" />
    </div>
    <div class="field" style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-tr" id="adSave" onclick="adminSave()">登录并加载配置</button>
      <button class="btn" onclick="closeAdmin()">关闭</button>
      <span class="muted" id="adStatus" style="margin-left:6px"></span>
    </div>
    <div id="adSettings" class="hidden" style="margin-top:10px">
      <div class="field">
        <label>目标页面</label>
        <input id="cfgUrl" placeholder="https://b23.tv/..." class="w-full! border! border-line! bg-bg! text-ink! rounded-xl2! px-3! py-2! text-sm! outline-none! focus:ring-2! focus:ring-accent! transition! mt-1!" />
      </div>
      <div class="field">
        <label>采集间隔</label>
        <select id="cfgPreset" onchange="onPreset()" class="border! border-line! bg-card! text-ink! rounded-xl2! px-3! py-2! text-sm! cursor-pointer! w-full! mt-1!">
          <option value="1">每 1 分钟</option>
          <option value="5">每 5 分钟</option>
          <option value="10">每 10 分钟</option>
          <option value="30">每 30 分钟</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="field">
        <label>自定义间隔（分钟）</label>
        <input id="cfgCustom" type="number" min="1" max="1440" value="1" class="w-full! border! border-line! bg-bg! text-ink! rounded-xl2! px-3! py-2! text-sm! outline-none! focus:ring-2! focus:ring-accent! transition! mt-1!" />
      </div>
      <div class="field" style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-tr" onclick="adminSaveConfig()">应用配置</button>
        <span class="muted" id="cfgStatus" style="margin-left:6px"></span>
      </div>
      <div class="muted" style="margin-top:6px;font-size:12px">保存后将立即生效。</div>
    </div>
  </div>
</div>

<script>
const fmt = n => Number(n||0).toLocaleString();
const dateFmt = s => s ? new Date(s).toLocaleString() : '-';
let chartMode = 'trend';
let latestCache = [];
let statsCache = {};
// 排序：按得票数从大到小；票数相同按名称拼音（localeCompare）保证稳定
const rankSort = (a,b) => {
  const d = (b.votes||0) - (a.votes||0);
  return d !== 0 ? d : String(a.title||'').localeCompare(String(b.title||''), 'zh');
};

function api(path, opts={}) {
  return fetch(path, opts).then(r => r.json()).catch(e => ({error: e.message}));
}

async function renderGeoFooter(){
  const flagEl = document.getElementById('footerFlag');
  const locEl = document.getElementById('footerLocation');
  const ipTextEl = document.getElementById('footerIpText');
  const browTextEl = document.getElementById('footerBrowserText');
  if(!flagEl || !locEl || !ipTextEl || !browTextEl) return;
  let j = {};
  let src = '';
  try{
    const r = await fetch('https://ipapi.co/json/', {signal: AbortSignal.timeout ? AbortSignal.timeout(5000) : undefined});
    if(r.ok){ j = await r.json(); src = 'ipapi'; }
  }catch(e){}
  const render = () => {
    const countryName = j.country_name || '';
    const city = j.city || '';
    const ip = j.ip || '';
    const browser = detectBrowser();
    flagEl.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:#f56c6c;display:inline-block"></span>';
    locEl.textContent = [countryName, city].filter(Boolean).join(' • ') || '-';
    if(ipTextEl) ipTextEl.textContent = ip || '-';
    if(browTextEl) browTextEl.textContent = browser || '-';
  };
  render();
  if(!src){
    try{
      const r2 = await fetch('https://ipapi.co/json/', {signal: AbortSignal.timeout ? AbortSignal.timeout(5000) : undefined});
      if(r2.ok){ j = await r2.json(); render(); }
    }catch(e){}
  }
}
function toggleFooterPill(el){
  if(!el || !el.dataset.expanded){
    el.dataset.expanded = 'true';
    el.style.background = '#ffffff';
    el.style.borderRadius = '999px';
    el.style.transform = 'translateY(-2px)';
    el.style.padding = '8px 18px';
    el.style.boxShadow = '0 8px 24px rgba(0,0,0,0.12),inset 0 1px 0 rgba(255,255,255,0.9)';
  }else{
    delete el.dataset.expanded;
    el.style.background = '#ffffff';
    el.style.borderRadius = '999px';
    el.style.transform = 'translateY(0)';
    el.style.padding = '4px 10px';
    el.style.boxShadow = '0 1px 4px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.9)';
  }
}
function countryCodeToFlag(code){
  const c = String(code || '').trim().toUpperCase();
  if(!/^[A-Z]{2}$/.test(c)) return '<span style="width:8px;height:8px;border-radius:50%;background:#e8364f;display:inline-block"></span>';
  return c.replace(/./g, ch => String.fromCodePoint((ch.charCodeAt(0) - 65) + 0x1F1E6));
}
function detectBrowser(){
  const ua = navigator.userAgent || '';
  const data = navigator.userAgentData?.brands || [];
  const chrome = data.find(b => /Chrome|Chromium|Edge|Opera/.test(b.brand));
  if(chrome && /Edg/.test(ua)) return 'Edge';
  if(chrome && /OPR|Opera/.test(ua)) return 'Opera';
  if(chrome && /Chrome|Chromium/.test(ua)) return 'Chrome';
  if(/Firefox/.test(ua)) return 'Firefox';
  if(/Safari/.test(ua) && !/Chrome/.test(ua)) return 'Safari';
  if(/MSIE|Trident/.test(ua)) return 'IE';
  return '';
}
async function load() {
  try {
    const [latest, stats] = await Promise.all([
      api('/api/latest'),
      api('/api/stats')
    ]).catch(e => ({latest: [], stats: {}}));

    latestCache = Array.isArray(latest) ? latest : [];

    const tb = document.getElementById('rows');
    if(!latestCache.length){
      tb.innerHTML = '<tr><td colspan="9" class="empty">暂无数据</td></tr>';
    } else {
      const sorted = latestCache.slice().sort(rankSort);
      tb.innerHTML = sorted.map((x,idx)=> `<tr>
        <td><span class="cand-rank">${idx+1}</span></td>
        <td><span class="cand-name">${x.title||''}</span></td>
        <td><span class="vote-val">${fmt(x.votes)}</span></td>
        <td class="muted" id="d1m_${idx}">-</td>
        <td class="muted" id="d5m_${idx}">-</td>
        <td class="muted" id="d30m_${idx}">-</td>
        <td class="muted" id="d6h_${idx}">-</td>
        <td class="muted" id="d24h_${idx}">-</td>
        <td>${dateFmt(x.captured_at)}</td>
      </tr>`).join('');
      // 并行拉取所有候选人的 diff，避免串行等待拖慢刷新
      const diffs = await Promise.all(
        sorted.map(x => api(`/api/diff?title=${encodeURIComponent(x.title)}`).catch(() => null))
      );
      for(let i=0;i<sorted.length;i++){
        const j = diffs[i] || {};
        const update = (id, v) => { const el = document.getElementById(id); if(el) el.innerHTML = v; };
        update(`d1m_${i}`, fmtDelta((j.intervals && j.intervals['1m']) ? j.intervals['1m'].delta : null));
        update(`d5m_${i}`, fmtDelta((j.intervals && j.intervals['5m']) ? j.intervals['5m'].delta : null));
        update(`d30m_${i}`, fmtDelta((j.intervals && j.intervals['30m']) ? j.intervals['30m'].delta : null));
        update(`d6h_${i}`, fmtDelta((j.intervals && j.intervals['6h']) ? j.intervals['6h'].delta : null));
        update(`d24h_${i}`, fmtDelta((j.intervals && j.intervals['24h']) ? j.intervals['24h'].delta : null));
      }
    }
    statsCache = stats || {};
    document.getElementById('s_count').textContent = fmt(statsCache.count);
    document.getElementById('s_max').textContent = fmt(statsCache.max_votes);
    document.getElementById('s_candidates').textContent = fmt(statsCache.candidates);
    document.getElementById('s_latest').textContent = statsCache.latest_capture ? dateFmt(statsCache.latest_capture) : '-';

    const candSelect = document.getElementById('chartCandidate');
    if(candSelect){
      candSelect.innerHTML = '';
      if(latestCache.length){
        candSelect.appendChild(new Option('-- 请选择 --', ''));
        latestCache.slice().sort(rankSort).forEach(x => {
          const opt = document.createElement('option');
          opt.value = (x.title||'').replace(/"/g,'&quot;');
          opt.textContent = x.title || '匿名';
          candSelect.appendChild(opt);
        });
      } else {
        candSelect.appendChild(new Option('未采集到数据', ''));
      }
    }
    if(document.getElementById('chartCandidate').value){
      await drawChart();
    }
    renderGeoFooter();
  } catch(e) {
    console.error('load failed', e);
  }
}

function fmtDelta(v){
  if(v === null || v === undefined) return '-';
  const n = Number(v);
  if(!Number.isFinite(n)) return '-';
  if(n === 0 || Object.is(n, -0)) return '<span class="delta-flat">0</span>';
  const sign = n > 0 ? '+' : '';
  const cls = n > 0 ? 'delta-up' : 'delta-down';
  return `<span class="${cls}">${sign}${fmt(n)}</span>`;
}

function setChartMode(mode, el){
  chartMode = mode;

async function drawChart(){
  try{
    const candSelect = document.getElementById('chartCandidate');
    const title = candSelect ? candSelect.value : '';
    const tbody = document.getElementById('chartRows');
    const canvas = document.getElementById('chartCanvas');
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    document.getElementById('chartHint').textContent = title ? `候选人：${title}` : '请选择候选人';
    if(!title){
      if(tbody) tbody.innerHTML='';
      const w = canvas.clientWidth || 900; const h = canvas.clientHeight || 260;
      canvas.width = w; canvas.height = h;
      canvas.style.display = 'block';
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.fillStyle = '#909399'; ctx.font = '14px sans-serif';
      ctx.fillText('请在顶部下拉框选择候选人', 60, h/2);
      if(tbody) document.getElementById('chartTableWrap').style.display='none';
      return;
    }
    const useRange = document.getElementById('rangeMode') && document.getElementById('rangeMode').checked;
    let q;
    if(useRange){
      let rs = document.getElementById('rangeStart').value;
      let re = document.getElementById('rangeEnd').value;
      if(!rs || !re){
        const meta = statsCache || {};
        if(!rs && meta.first_capture) rs = meta.first_capture.slice(0,16);
        if(!re && meta.latest_capture) re = meta.latest_capture.slice(0,16);
        if(rs) document.getElementById('rangeStart').value = rs;
        if(re) document.getElementById('rangeEnd').value = re;
      }
      q = `/api/range?title=${encodeURIComponent(title)}`;
      if(rs) q += `&start=${encodeURIComponent(new Date(rs).toISOString())}`;
      if(re) q += `&end=${encodeURIComponent(new Date(re).toISOString())}`;
    } else {
      q = `/api/history?title=${encodeURIComponent(title)}&limit=300`;
    }
    const hist = await api(q).catch(()=> ({}));
    const points = Array.isArray(hist) ? hist : [];
    const canvasPoints = points.length > 200 ? points.filter((_,i)=> i % Math.ceil(points.length/200) === 0 || i === points.length-1) : points.slice();
    const w = canvas.clientWidth || 900; const h = canvas.clientHeight || 260;
    canvas.width = w; canvas.height = h;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--card').trim() || '#fff';
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1;
    for(let i=0;i<=5;i++){ const y=Math.round(i*(h-40)/5)+20; ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(w-10,y);ctx.stroke(); }
    if(chartMode === 'bar' && canvasPoints.length){
      const votes = canvasPoints.map(p=>p.votes);
      const max = Math.max(...votes); const min = Math.min(...votes);
      const pad=60; const plotW=w-90; const plotH=h-70;
      const bw = Math.max(6, plotW / canvasPoints.length - 2);
      canvasPoints.forEach((p,i)=>{
        const x = pad + (i/(canvasPoints.length||1))*plotW;
        const bh = ((p.votes-min)/(max-min||1))*plotH;
        const y = 20+plotH-bh;
        ctx.fillStyle = 'rgba(64,158,255,0.85)';
        ctx.fillRect(x,y,bw,bh);
        if(canvasPoints.length < 20 || i % Math.ceil(canvasPoints.length/20) === 0){
          ctx.fillStyle='#606266'; ctx.font='10px sans-serif';
          ctx.fillText(new Date(p.captured_at).toLocaleTimeString(), x, 20+plotH+14);
        }
      });
      ctx.fillStyle='#303133'; ctx.font='12px sans-serif';
      ctx.fillText(max.toLocaleString(), 6, 30);
      ctx.fillText(min.toLocaleString(), 6, h-20);
    } else if(chartMode === 'delta' && canvasPoints.length >= 2){
      const deltas = canvasPoints.slice(1).map((p,i)=> p.votes - canvasPoints[i].votes);
      const max = Math.max(...deltas,0); const min = Math.min(...deltas,0);
      const pad=60; const plotW=w-90; const plotH=h-70;
      const bw = Math.max(6, plotW / deltas.length - 2);
      deltas.forEach((d,i)=>{
        const x = pad + (i/(deltas.length||1))*plotW;
        const bh = (Math.abs(d)/(Math.max(max,Math.abs(min))||1))*plotH;
        const y = d>=0 ? 20+plotH/2-bh : 20+plotH/2;
        ctx.fillStyle = d>=0 ? 'rgba(245,108,108,0.85)' : 'rgba(103,194,58,0.85)';
        ctx.fillRect(x,y,bw,bh);
      });
      ctx.fillStyle='#303133'; ctx.font='12px sans-serif';
      ctx.fillText(`+${fmt(max)}`, 6, 30);
      ctx.fillText(`${fmt(min)}`, 6, h-20);
      ctx.fillText('0', 20, 20+plotH/2+6);
    } else if(canvasPoints.length >= 2){
      const votes = canvasPoints.map(p=>p.votes);
      const mn = Math.min(...votes); const mx = Math.max(...votes);
      const pad = 20; const plotW = w-60; const plotH = h-70;
      const xFor = i => 50 + (i/(canvasPoints.length-1))*plotW;
      const yFor = v => 20 + plotH - ((v-mn)/(mx-mn||1))*plotH;
      ctx.beginPath(); ctx.strokeStyle = '#409eff'; ctx.lineWidth = 2;
      canvasPoints.forEach((p,i)=>{ const x=xFor(i), y=yFor(p.votes); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.stroke();
      ctx.beginPath(); ctx.fillStyle = 'rgba(64,158,255,0.15)';
      canvasPoints.forEach((p,i)=>{ const x=xFor(i), y=yFor(p.votes); ctx.lineTo(x,y); ctx.lineTo(x,20+plotH); });
      ctx.closePath(); ctx.fill();
      canvasPoints.forEach((p,i)=>{ const x=xFor(i), y=yFor(p.votes); ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fillStyle='#409eff'; ctx.fill(); });
      ctx.fillStyle='#303133'; ctx.font='12px sans-serif';
      ctx.fillText(mx.toLocaleString(), 6, yFor(mx)+4);
      ctx.fillText(mn.toLocaleString(), 6, yFor(mn)+4);
    } else if(points.length === 0){
      const y = 20 + (h-70)/2;
      ctx.fillStyle = '#909399'; ctx.font = '14px sans-serif';
      ctx.fillText('暂无该候选人历史数据', 60, y);
    } else {
      ctx.fillStyle = '#909399'; ctx.font = '14px sans-serif';
      ctx.fillText('数据点不足（至少2条），继续采集后即可生成趋势', 60, h/2);
    }
    if(points.length){
      document.getElementById('chartTableWrap').style.display='block';
      tbody.innerHTML = points.slice().reverse().map((p,i)=>{
      const prev = i < points.length - 1 ? points[points.length - 2 - i].votes : null;
      const delta = prev !== null ? p.votes - prev : null;
      const deltaStr = delta !== null ? ((delta>=0?'+':'')+fmt(delta)) : '-';
      const deltaClass = delta > 0 ? 'delta-up' : delta < 0 ? 'delta-down' : 'delta-flat';
      return `<tr><td>${i+1}</td><td>${dateFmt(p.captured_at)}</td><td><b>${fmt(p.votes)}</b></td><td class="${deltaClass}">${deltaStr}</td></tr>`;
    }).join('');
    }
  }catch(e){
    console.error('drawChart failed', e);
  }
}

function openAdmin(){ document.getElementById('adminModal').style.display='flex'; }

async function adminSave(){
  try{
    const user = document.getElementById('adUser').value;
    const pass = document.getElementById('adPass').value;
    const payload = {
      target_url: document.getElementById('cfgUrl').value.trim(),
      poll_interval: Number(document.getElementById('cfgCustom').value || 1)
    };
    const r = await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Basic '+btoa(user+':'+pass)}, body: JSON.stringify(payload)});
    const j = await r.json();
    document.getElementById('adStatus').textContent = j.ok ? '已保存，配置立即生效' : '保存失败，检查账号密码';
    if(j.ok){
      document.getElementById('adSettings').classList.remove('hidden');
      setTimeout(load, 600);
      setTimeout(() => drawChart(), 800);
    }
  }catch(e){
    document.getElementById('adStatus').textContent = '登录失败';
    console.error(e);
  }
}

  document.documentElement.setAttribute('data-theme', name);

  try{ localStorage.setItem('theme', name); }catch(e){}
}
function api(path, opts={}) {
  return fetch(path, opts).then(r => r.json()).catch(e => ({error: e.message}));
}
(function init(){
  try{
    const saved = localStorage.getItem('theme');
    const preferred = ['emerald','midnight','ruby','gold','ocean'].includes(saved) ? saved : 'emerald';
    setTheme(preferred);
  }catch(e){ setTheme('emerald'); }
})();
