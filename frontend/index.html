<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bili Vote Tracker</title>
<script src="/assets/vendor/tailwind.min.js"></script>
<script>
tailwind.config = {
  corePlugins: { preflight: false },   // 禁用 reset，避免破坏现有元素
  theme: {
    extend: {
      colors: {
        bg:    'var(--bg)',
        card:  'var(--card)',
        line:  'var(--line)',
        ink:   'var(--ink)',
        muted: 'var(--muted)',
        accent:'var(--accent)',
        ok:    'var(--ok)',
        warn:  'var(--warn)',
        danger:'var(--danger)',
      },
      fontFamily: {
        sans: ['-apple-system','BlinkMacSystemFont','"Segoe UI"','"PingFang SC"','"Microsoft YaHei"','sans-serif'],
      },
      boxShadow: {
        card: '0 2px 12px rgba(0,0,0,.06)',
        lift: '0 10px 30px rgba(0,0,0,.12)',
      },
      borderRadius: {
        xl2: '16px',
        xl3: '20px',
      },
    }
  }
}
</script>
<style>
:root{color-scheme:light;--bg:#fafafa;--bg-glow:rgba(64,158,255,.06);--card:#ffffff;--line:#ececec;--ink:#18181b;--muted:#71717a;--accent:#3b82f6;--accent2:#6366f1;--ok:#16a34a;--warn:#f59e0b;--danger:#ef4444;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);--r:14px;--banner-from:#ffffff;--banner-to:#fafafa}
[data-theme="midnight"]{--bg:#f4f6fb;--bg-glow:rgba(59,130,246,.08);--card:#ffffff;--line:#e2e8f7;--ink:#0f172a;--muted:#475569;--accent:#3b82f6;--accent2:#6366f1;--ok:#10b981;--warn:#f59e0b;--danger:#ef4444}
[data-theme="ruby"]{--bg:#fdf9f9;--bg-glow:rgba(225,29,72,.07);--card:#ffffff;--line:#f4dbe3;--ink:#2b1018;--muted:#8a5a66;--accent:#e11d48;--accent2:#f97316;--ok:#16a34a;--warn:#d97706;--danger:#dc2626}
[data-theme="gold"]{--bg:#fdfcf8;--bg-glow:rgba(217,119,6,.07);--card:#ffffff;--line:#f3e6c8;--ink:#3b2a10;--muted:#7c5a20;--accent:#d97706;--accent2:#f59e0b;--ok:#15803d;--warn:#b45309;--danger:#b91c1c}
[data-theme="ocean"]{--bg:#f4fbfe;--bg-glow:rgba(2,132,199,.08);--card:#ffffff;--line:#dcebf8;--ink:#052038;--muted:#3b6d88;--accent:#0284c7;--accent2:#22d3ee;--ok:#059669;--warn:#d97706;--danger:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;background-image:radial-gradient(1100px 560px at 50% -12%,var(--bg-glow),transparent 60%);background-repeat:no-repeat;-webkit-font-smoothing:antialiased}
.glass-orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:.5}
.glass-orb{position:absolute;border-radius:50%;filter:blur(90px);animation:orb-float 20s ease-in-out infinite alternate}
.glass-orb-1{width:44vw;height:44vh;top:-8%;left:-4%;background:var(--bg-glow)}
.glass-orb-2{width:36vw;height:40vh;bottom:-8%;right:-6%;background:var(--bg-glow);animation-delay:-6s}
.glass-orb-3{width:28vw;height:32vh;top:36%;left:40%;background:var(--bg-glow);animation-delay:-12s}
@keyframes orb-float{0%{transform:translate(0) scale(1)}50%{transform:translate(8%,12%) scale(1.08)}to{transform:translate(-5%,8%) scale(.95)}}
.app{max-width:1280px;margin:0 auto;padding:28px 16px 64px}
header{position:sticky;top:12px;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;margin:0 0 22px;border-radius:16px;background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 30px rgba(0,0,0,.04)}
header h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;color:var(--ink)}
.logo-dot{width:11px;height:11px;border-radius:3.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 14px var(--accent);display:inline-block}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border:none;border-radius:10px;color:var(--muted);background:transparent;cursor:pointer;font-size:15px;transition:color .15s,background .15s}
.btn:hover{color:var(--ink);background:rgba(0,0,0,.05)}
.btn-tr{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.btn-tr:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.10);color:var(--ink)}
.btn-tr:active{transform:translateY(0) scale(.97)}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1),0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.btn-primary:active{transform:translateY(0) scale(.97)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--bar-a,var(--accent)),var(--bar-b,transparent));opacity:.85}
.stat .label{font-size:12px;color:var(--muted);letter-spacing:.02em;font-weight:500;padding:18px 20px 0}
.stat .value{font-size:24px;font-weight:700;margin:6px 20px 18px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.08)}
.kpi-green{color:var(--ok)}.kpi-blue{color:var(--accent)}.kpi-orange{color:var(--warn)}.kpi-red{color:var(--danger)}
.table-wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:20px;transition:box-shadow .25s ease}
.table-wrap:hover{box-shadow:0 12px 36px rgba(0,0,0,.07)}
table{width:100%;border-collapse:collapse;min-width:1100px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13.5px;vertical-align:middle;white-space:nowrap}
th{color:var(--ink);font-weight:600;background:var(--card);position:sticky;top:0;z-index:2}
tbody tr{transition:background .12s ease}
tbody tr:hover{background:rgba(0,0,0,.02)}
.cand-name{display:inline-flex;align-items:center;gap:10px;font-weight:600;color:var(--ink)}
.cand-rank{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;border-radius:7px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.vote-val{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:20px;transition:box-shadow .25s ease}
.chart:hover{box-shadow:0 16px 40px rgba(0,0,0,.07)}
.chart-header{display:flex;gap:12px;padding:0 2px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.chart-title{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.empty{text-align:center;padding:28px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.tabs{display:inline-flex;gap:4px;margin-bottom:14px;padding:4px;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line);border-radius:12px}
.tab{padding:7px 14px;border:none;border-radius:9px;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;transition:all .18s}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab-desc{font-size:11px;opacity:.6}
footer{text-align:center;color:var(--muted);font-size:12px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(460px,94vw);box-shadow:0 24px 60px rgba(0,0,0,.2);color:var(--ink)}
.modal h3{margin:0 0 16px;font-size:18px;letter-spacing:-.02em}
.modal .field{margin-bottom:16px}
.modal label{font-size:13px;font-weight:600;color:var(--ink);display:block;margin-bottom:6px}
.modal input,.modal select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:14px;width:100%;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.delta{font-weight:600;font-variant-numeric:tabular-nums}
.delta-up{color:var(--danger)}.delta-down{color:var(--ok)}.delta-flat{color:var(--muted)}
.hidden{display:none!important}
.candidate-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.candidate-wrap label{font-size:13px;color:var(--muted);font-weight:600}
.candidate-wrap select{padding:8px 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--ink);font-size:14px;min-width:190px;cursor:pointer}
.chart-hint{font-size:12.5px;color:var(--muted)}
.sel{padding:8px 14px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.placeholder{opacity:.25}
</head>
<body>

/* ===== 奥特曼主题光效 ===== */
.logo-dot{background:linear-gradient(135deg,#ff3b30,#3b82f6);box-shadow:0 0 18px #ff3b30aa,0 0 28px #3b82f6aa}
body{background:
  radial-gradient(1000px 520px at 15% -10%,rgba(255,59,48,.12),transparent 60%),
  radial-gradient(1000px 520px at 85% -10%,rgba(59,130,246,.14),transparent 60%),
  radial-gradient(800px 480px at 50% 110%,rgba(59,130,246,.10),transparent 60%),
  var(--bg)!important;background-repeat:no-repeat;background-attachment:fixed}
.glass-orb-1{background:linear-gradient(135deg,#ff3b3026,#3b82f626)}
.glass-orb-2{background:linear-gradient(135deg,#3b82f62b,#22d3ee26)}
.glass-orb-3{background:linear-gradient(135deg,#f59e0b26,#ff3b3026)}
.cand-ava{width:44px;height:44px;border-radius:12px;object-fit:cover;border:2px solid color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:0 2px 10px rgba(0,0,0,.12),0 0 14px color-mix(in srgb,var(--accent) 18%,transparent);flex:none;background:#fff}
.cand-name{gap:12px}

/* ===== 手机端响应式 ===== */
@media (max-width:768px){
  .stats{grid-template-columns:repeat(2,1fr);gap:12px}
  .stat .value{font-size:20px}
  .app{padding:14px 10px 48px}
  header{padding:10px 14px;border-radius:14px}
  header h1{font-size:17px}
  .chart-header{gap:8px}
  #rangeStart,#rangeEnd{width:100%;margin-top:2px}
  .candidate-wrap{width:100%}
  .candidate-wrap select{flex:1;min-width:0}
  #chartHint{width:100%}
  .tabs{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{white-space:nowrap}
  .table-wrap{-webkit-overflow-scrolling:touch}
  footer{flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 8px}
  footer #footerGeo{max-width:92vw;overflow:hidden;text-overflow:ellipsis}
}
@media (max-width:400px){
  .stats{grid-template-columns:1fr}
}

</style>

  <div class="glass-orb glass-orb-1"></div>

</div>
<div class="app">

    <div style="display:flex;align-items:center;gap:6px">
      <select id="themeSelect" onchange="setTheme(this.value)" title="主题" class="sel">
        <option value="emerald">Emerald</option>
        <option value="midnight">Midnight</option>

  <div class="stats">
    <div class="card stat" style="--bar-a:#71717a;--bar-b:transparent"><div class="label">候选人</div><div class="value" id="s_candidates"><span class="skeleton">加载中</span></div></div>
    <div class="card stat" style="--bar-a:var(--accent);--bar-b:var(--accent2)"><div class="label">总采集数</div><div class="value kpi-blue" id="s_count"><span class="skeleton">--</span></div></div>
    <div class="card stat" style="--bar-a:var(--warn);--bar-b:transparent"><div class="label">最高票数</div><div class="value kpi-orange" id="s_max"><span class="skeleton">--</span></div></div>
    <div class="card stat" style="--bar-a:var(--ok);--bar-b:transparent"><div class="label">最近采集</div><div class="value kpi-green" id="s_latest"><span class="skeleton">--</span></div></div>

  <div class="table-wrap">

    <div class="tabs">

    <div style="margin-top:8px;display:none" id="chartTableWrap">
      <table>
        <thead>
          <tr style="background:linear-gradient(180deg,var(--banner-from),var(--banner-to))"><th>#</th><th>采集时间</th><th>票数</th><th>环比增量</th></tr>

        <tbody id="chartRows"></tbody>
      </table>

  </div>
</div>

  <footer style="width:100%;display:flex;justify-content:space-between;align-items:center;max-width:1600px;margin:0 auto;padding:16px;font-size:12px;color:#606266">

<script>
const {fmt, dateFmt, heroSrc, rankSort, fmtDelta} = window.BVTLogic;
let chartMode = 'trend';
let latestCache = [];
let statsCache = {};

function api(path, opts={}) {
  return fetch(path, opts).then(r => r.json()).catch(e => ({error: e.message}));
}

async function renderGeoFooter(){
  const flagEl = document.getElementById('footerFlag');
  const locEl = document.getElementById('footerLocation');
  const ipTextEl = document.getElementById('footerIpText');
  const browTextEl = document.getElementById('footerBrowserText');
  if(!flagEl || !locEl || !ipTextEl || !browTextEl) return;
  let j = {};
  let src = '';
  try{
    const r = await fetch('https://ipapi.co/json/', {signal: AbortSignal.timeout ? AbortSignal.timeout(5000) : undefined});
    if(r.ok){ j = await r.json(); src = 'ipapi'; }
  }catch(e){}
  const render = () => {
    const countryName = j.country_name || '';
    const city = j.city || '';
    const ip = j.ip || '';
    const browser = detectBrowser();
    flagEl.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:#f56c6c;display:inline-block"></span>';
    locEl.textContent = [countryName, city].filter(Boolean).join(' • ') || '-';
    if(ipTextEl) ipTextEl.textContent = ip || '-';
    if(browTextEl) browTextEl.textContent = browser || '-';
  };
  render();
  if(!src){
    try{
      const r2 = await fetch('https://ipapi.co/json/', {signal: AbortSignal.timeout ? AbortSignal.timeout(5000) : undefined});
      if(r2.ok){ j = await r2.json(); render(); }
    }catch(e){}
  }
}

function detectBrowser(){
  const ua = navigator.userAgent || '';
  const data = navigator.userAgentData?.brands || [];
  const chrome = data.find(b => /Chrome|Chromium|Edge|Opera/.test(b.brand));
  if(chrome && /Edg/.test(ua)) return 'Edge';
  if(chrome && /OPR|Opera/.test(ua)) return 'Opera';
  if(chrome && /Chrome|Chromium/.test(ua)) return 'Chrome';
  if(/Firefox/.test(ua)) return 'Firefox';
  if(/Safari/.test(ua) && !/Chrome/.test(ua)) return 'Safari';
  if(/MSIE|Trident/.test(ua)) return 'IE';
  return '';
}
async function load() {
  try {
    const [latest, stats] = await Promise.all([
      api('/api/latest'),
      api('/api/stats')
    ]).catch(e => ({latest: [], stats: {}}));

    latestCache = Array.isArray(latest) ? latest : [];

    const tb = document.getElementById('rows');
    if(!latestCache.length){
      tb.innerHTML = '<tr><td colspan="9" class="empty">暂无数据</td></tr>';
    } else {
      const sorted = latestCache.slice().sort(rankSort);
      tb.innerHTML = sorted.map((x,idx)=> `<tr>
        <td><span class="cand-rank">${idx+1}</span></td>
        <td><span class="cand-name">${heroSrc(x.title)?`<img class="cand-ava" src="${heroSrc(x.title)}" alt="" loading="lazy">`:''}${x.title||''}</span></td>
        <td><span class="vote-val">${fmt(x.votes)}</span></td>
        <td class="muted" id="d1m_${idx}">-</td>
        <td class="muted" id="d5m_${idx}">-</td>
        <td class="muted" id="d30m_${idx}">-</td>
        <td class="muted" id="d6h_${idx}">-</td>
        <td class="muted" id="d24h_${idx}">-</td>
        <td>${dateFmt(x.captured_at)}</td>
      </tr>`).join('');
      // 并行拉取所有候选人的 diff，避免串行等待拖慢刷新
      const diffs = await Promise.all(
        sorted.map(x => api(`/api/diff?title=${encodeURIComponent(x.title)}`).catch(() => null))
      );
      for(let i=0;i<sorted.length;i++){
        const j = diffs[i] || {};
        const update = (id, v) => { const el = document.getElementById(id); if(el) el.innerHTML = v; };
        // 无历史对比点时视为 0（新候选人刚入库），比 '-' 更清晰
        const dv = k => (j.intervals && j.intervals[k] && j.intervals[k].delta !== undefined) ? j.intervals[k].delta : 0;
        update(`d1m_${i}`, fmtDelta(dv('1m')));
        update(`d5m_${i}`, fmtDelta(dv('5m')));
        update(`d30m_${i}`, fmtDelta(dv('30m')));
        update(`d6h_${i}`, fmtDelta(dv('6h')));
        update(`d24h_${i}`, fmtDelta(dv('24h')));
      }
    }
    statsCache = stats || {};
    document.getElementById('s_count').textContent = fmt(statsCache.count);
    document.getElementById('s_max').textContent = fmt(statsCache.max_votes);
    document.getElementById('s_candidates').textContent = fmt(statsCache.candidates);
    document.getElementById('s_latest').textContent = statsCache.latest_capture ? dateFmt(statsCache.latest_capture) : '-';

    const candSelect = document.getElementById('chartCandidate');
    if(candSelect){
      candSelect.innerHTML = '';
      if(latestCache.length){
        candSelect.appendChild(new Option('-- 请选择 --', ''));
        latestCache.slice().sort(rankSort).forEach(x => {
          const opt = document.createElement('option');
          opt.value = (x.title||'').replace(/"/g,'&quot;');
          opt.textContent = x.title || '匿名';
          candSelect.appendChild(opt);
        });
      } else {
        candSelect.appendChild(new Option('未采集到数据', ''));
      }
    }
    if(document.getElementById('chartCandidate').value){
      await drawChart();
    }
    renderGeoFooter();
  } catch(e) {
    console.error('load failed', e);
  }
}

async function drawChart(){
  try{
    const candSelect = document.getElementById('chartCandidate');
    const title = candSelect ? candSelect.value : '';
    const tbody = document.getElementById('chartRows');
    const canvas = document.getElementById('chartCanvas');
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    document.getElementById('chartHint').textContent = title ? `候选人：${title}` : '请选择候选人';
    if(!title){
      if(tbody) tbody.innerHTML='';
      const w = canvas.clientWidth || 900; const h = canvas.clientHeight || 260;
      canvas.width = w; canvas.height = h;
      canvas.style.display = 'block';
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.fillStyle = '#909399'; ctx.font = '14px sans-serif';
      ctx.fillText('请在顶部下拉框选择候选人', 60, h/2);
      if(tbody) document.getElementById('chartTableWrap').style.display='none';
      return;
    }
    const useRange = document.getElementById('rangeMode') && document.getElementById('rangeMode').checked;
    let q;
    if(useRange){
      let rs = document.getElementById('rangeStart').value;
      let re = document.getElementById('rangeEnd').value;
      if(!rs || !re){
        const meta = statsCache || {};
        if(!rs && meta.first_capture) rs = meta.first_capture.slice(0,16);
        if(!re && meta.latest_capture) re = meta.latest_capture.slice(0,16);
        if(rs) document.getElementById('rangeStart').value = rs;
        if(re) document.getElementById('rangeEnd').value = re;
      }
      q = `/api/range?title=${encodeURIComponent(title)}`;
      if(rs) q += `&start=${encodeURIComponent(new Date(rs).toISOString())}`;
      if(re) q += `&end=${encodeURIComponent(new Date(re).toISOString())}`;
    } else {
      q = `/api/history?title=${encodeURIComponent(title)}&limit=300`;
    }
    const hist = await api(q).catch(()=> ({}));
    const points = Array.isArray(hist) ? hist : [];
    const canvasPoints = points.length > 200 ? points.filter((_,i)=> i % Math.ceil(points.length/200) === 0 || i === points.length-1) : points.slice();
    const w = canvas.clientWidth || 900; const h = canvas.clientHeight || 260;
    canvas.width = w; canvas.height = h;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--card').trim() || '#fff';
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1;
    for(let i=0;i<=5;i++){ const y=Math.round(i*(h-40)/5)+20; ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(w-10,y);ctx.stroke(); }
    if(chartMode === 'bar' && canvasPoints.length){
      const votes = canvasPoints.map(p=>p.votes);
      const max = Math.max(...votes); const min = Math.min(...votes);
      const pad=60; const plotW=w-90; const plotH=h-70;
      const bw = Math.max(6, plotW / canvasPoints.length - 2);
      canvasPoints.forEach((p,i)=>{
        const x = pad + (i/(canvasPoints.length||1))*plotW;
        const bh = ((p.votes-min)/(max-min||1))*plotH;
        const y = 20+plotH-bh;
        ctx.fillStyle = 'rgba(64,158,255,0.85)';
        ctx.fillRect(x,y,bw,bh);
        if(canvasPoints.length < 20 || i % Math.ceil(canvasPoints.length/20) === 0){
          ctx.fillStyle='#606266'; ctx.font='10px sans-serif';
          ctx.fillText(new Date(p.captured_at).toLocaleTimeString(), x, 20+plotH+14);
        }
      });
      ctx.fillStyle='#303133'; ctx.font='12px sans-serif';
      ctx.fillText(max.toLocaleString(), 6, 30);
      ctx.fillText(min.toLocaleString(), 6, h-20);
    } else if(chartMode === 'delta' && canvasPoints.length >= 2){
      const deltas = canvasPoints.slice(1).map((p,i)=> p.votes - canvasPoints[i].votes);
      const max = Math.max(...deltas,0); const min = Math.min(...deltas,0);
      const pad=60; const plotW=w-90; const plotH=h-70;
      const bw = Math.max(6, plotW / deltas.length - 2);
      deltas.forEach((d,i)=>{
        const x = pad + (i/(deltas.length||1))*plotW;
        const bh = (Math.abs(d)/(Math.max(max,Math.abs(min))||1))*plotH;
        const y = d>=0 ? 20+plotH/2-bh : 20+plotH/2;
        ctx.fillStyle = d>=0 ? 'rgba(245,108,108,0.85)' : 'rgba(103,194,58,0.85)';
        ctx.fillRect(x,y,bw,bh);
      });
      ctx.fillStyle='#303133'; ctx.font='12px sans-serif';
      ctx.fillText(`+${fmt(max)}`, 6, 30);
      ctx.fillText(`${fmt(min)}`, 6, h-20);
      ctx.fillText('0', 20, 20+plotH/2+6);
    } else if(canvasPoints.length >= 2){
      const votes = canvasPoints.map(p=>p.votes);
      const mn = Math.min(...votes); const mx = Math.max(...votes);
      const pad = 20; const plotW = w-60; const plotH = h-70;
      const xFor = i => 50 + (i/(canvasPoints.length-1))*plotW;
      const yFor = v => 20 + plotH - ((v-mn)/(mx-mn||1))*plotH;
      ctx.beginPath(); ctx.strokeStyle = '#409eff'; ctx.lineWidth = 2;
      canvasPoints.forEach((p,i)=>{ const x=xFor(i), y=yFor(p.votes); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.stroke();
      ctx.beginPath(); ctx.fillStyle = 'rgba(64,158,255,0.15)';
      canvasPoints.forEach((p,i)=>{ const x=xFor(i), y=yFor(p.votes); ctx.lineTo(x,y); ctx.lineTo(x,20+plotH); });
      ctx.closePath(); ctx.fill();
      canvasPoints.forEach((p,i)=>{ const x=xFor(i), y=yFor(p.votes); ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fillStyle='#409eff'; ctx.fill(); });
      ctx.fillStyle='#303133'; ctx.font='12px sans-serif';
      ctx.fillText(mx.toLocaleString(), 6, yFor(mx)+4);
      ctx.fillText(mn.toLocaleString(), 6, yFor(mn)+4);
    } else if(points.length === 0){
      const y = 20 + (h-70)/2;
      ctx.fillStyle = '#909399'; ctx.font = '14px sans-serif';
      ctx.fillText('暂无该候选人历史数据', 60, y);
    } else {
      ctx.fillStyle = '#909399'; ctx.font = '14px sans-serif';
      ctx.fillText('数据点不足（至少2条），继续采集后即可生成趋势', 60, h/2);
    }
    if(points.length){
      document.getElementById('chartTableWrap').style.display='block';
      tbody.innerHTML = points.slice().reverse().map((p,i)=>{
      const prev = i < points.length - 1 ? points[points.length - 2 - i].votes : null;
      const delta = prev !== null ? p.votes - prev : null;
      const deltaStr = delta !== null ? ((delta>=0?'+':'')+fmt(delta)) : '-';
      const deltaClass = delta > 0 ? 'delta-up' : delta < 0 ? 'delta-down' : 'delta-flat';
      return `<tr><td>${i+1}</td><td>${dateFmt(p.captured_at)}</td><td><b class="vote-val">${fmt(p.votes)}</b></td><td class="${deltaClass} delta">${deltaStr}</td></tr>`;
    }).join('');
    }
  }catch(e){
    console.error('drawChart failed', e);
  }
}

      target_url: document.getElementById('cfgUrl').value.trim(),

    };
    const r = await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Basic '+btoa(user+':'+pass)}, body: JSON.stringify(payload)});

    document.getElementById('adStatus').textContent = j.ok ? '已保存，配置立即生效' : '保存失败，检查账号密码';
